name: Build INF Stock (1.21.4 + 1.21.11)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mc: "1.21.4"
            fabric: "0.119.4+1.21.4"
          - mc: "1.21.11"
            fabric: "0.141.3+1.21.11"
    steps:
      - uses: actions/checkout@v4
      - name: Find project folder
        run: |
          F=$(find . -name settings.gradle -not -path './.git/*' | head -n1)
          if [ -z "$F" ]; then echo "settings.gradle NOT FOUND in repo"; ls -R; exit 1; fi
          echo "DIR=$(dirname "$F")" >> $GITHUB_ENV
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Build ${{ matrix.mc }}
        working-directory: ${{ env.DIR }}
        run: gradle build -Pminecraft_version=${{ matrix.mc }} -Pfabric_version=${{ matrix.fabric }} --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: infstock-${{ matrix.mc }}
          path: ${{ env.DIR }}/build/libs/infstock-*.jar
