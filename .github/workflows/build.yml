name: build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Minecraft ${{ matrix.minecraft }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: "1.21.4"
            fabric_api: "0.119.4+1.21.4"
          - minecraft: "1.21.11"
            fabric_api: "0.141.4+1.21.11"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build (Minecraft ${{ matrix.minecraft }})
        run: gradle build --no-daemon -Pminecraft_version=${{ matrix.minecraft }} -Pfabric_version=${{ matrix.fabric_api }}

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: inf-stock-auto-${{ matrix.minecraft }}
          if-no-files-found: error
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
