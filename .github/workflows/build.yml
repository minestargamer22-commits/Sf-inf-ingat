name: Build INF Stock (1.21.4 + 1.21.11)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mc: "1.21.4"
            fabric: "0.119.4+1.21.4"
          - mc: "1.21.11"
            fabric: "0.141.3+1.21.11"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Build ${{ matrix.mc }}
        run: gradle build -Pminecraft_version=${{ matrix.mc }} -Pfabric_version=${{ matrix.fabric }} --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: infstock-${{ matrix.mc }}
          path: build/libs/infstock-*.jar
